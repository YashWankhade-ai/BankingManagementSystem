{% extends "base.html" %}

{% block title %}Deposit Funds — NovaBank{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Deposit Funds</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem;">
            Current Balance: <strong style="color: #6ee7b7;">₹{{ "{:,.2f}".format(account.balance) }}</strong>
        </p>

        <form method="POST" action="/deposit">
            <div class="form-group">
                <label class="form-label" for="amount">Deposit Amount (₹)</label>
                <input class="form-control" type="number" step="0.01" min="1" id="amount" name="amount" placeholder="e.g. 5000" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Remark / Note (Optional)</label>
                <input class="form-control" type="text" id="description" name="description" placeholder="e.g. Salary / Cash deposit">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.8rem;">
                Confirm Deposit
            </button>
        </form>
    </div>
</div>
{% endblock %}
