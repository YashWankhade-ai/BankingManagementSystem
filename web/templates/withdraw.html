{% extends "base.html" %}

{% block title %}Withdraw Funds — NovaBank{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Withdraw Funds</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem;">
            Available Balance: <strong style="color: #6ee7b7;">₹{{ "{:,.2f}".format(account.balance) }}</strong>
        </p>

        <form method="POST" action="/withdraw">
            <div class="form-group">
                <label class="form-label" for="amount">Withdrawal Amount (₹)</label>
                <input class="form-control" type="number" step="0.01" min="1" id="amount" name="amount" placeholder="e.g. 1000" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="pin">4-Digit Security PIN</label>
                <input class="form-control" type="password" maxlength="4" pattern="\d{4}" id="pin" name="pin" placeholder="••••" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Remark / Note (Optional)</label>
                <input class="form-control" type="text" id="description" name="description" placeholder="e.g. ATM withdrawal">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.8rem;">
                Confirm Withdrawal
            </button>
        </form>
    </div>
</div>
{% endblock %}
