{% extends "base.html" %}

{% block title %}Admin Sign In — NovaBank{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
    <div class="card" style="border-color: rgba(245, 158, 11, 0.3);">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
            <span class="badge frozen">Management Console</span>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Staff & Admin Login</h2>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem;">Authorized personnel access only.</p>

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label class="form-label" for="username">Admin Username</label>
                <input class="form-control" type="text" id="username" name="username" placeholder="e.g. admin" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem; background: linear-gradient(135deg, #d97706, #b45309);">
                Authenticate Admin
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            Default admin: <code>admin</code> / <code>Admin@123</code>
        </div>
    </div>
</div>
{% endblock %}
